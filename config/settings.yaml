data:
  start_date: "2000-01-01"
  cache_dir: "data/raw"
  processed_dir: "data/processed"
  labels_dir: "data/labels"
  cache_expiry_hours: 24

fred:
  api_key_env: "FRED_API_KEY"

anthropic:
  api_key_env: "ANTHROPIC_API_KEY"
  model: "claude-opus-4-7"
  use_llm: false   # flip to true once ANTHROPIC_API_KEY is set
  max_tokens: 1024

models:
  retrain_frequency: "monthly"
  horizons: [5, 21, 63]         # trading days
  min_train_samples: 756         # ~3 years of daily data
  ensemble_weights:
    lgbm: 0.5
    xgb: 0.3
    ridge: 0.2
  artifacts_dir: "models"

stress_index:
  percentile_window: 756         # 3-year rolling percentile window
  classification:
    low:      [0,  25]
    elevated: [26, 50]
    high:     [51, 75]
    extreme:  [76, 100]
  dimension_weights:
    equity:        0.20
    credit:        0.20
    rates:         0.175
    liquidity:     0.175
    fx:            0.125
    international: 0.125

direction:
  up_threshold:   0.01    # forward return > +1%  → Up
  down_threshold: -0.01   # forward return < -1%  → Down
  # otherwise: Neutral

reporting:
  output_dir: "reports"
  generate_pdf: true
  generate_html: true
  top_n_factors: 5
